name: ThunderAI Weblate badges
# Refreshes the ThunderAI Weblate translation status badges (static/weblate/thunderai/<lang>.svg).
# Started by micz/ThunderAI (.github/workflows/update-weblate-badges.yml) with a repository_dispatch
# of event_type "thunderai-weblate-badges" on every stable release, or by hand here.
# client_payload: { ref: ThunderAI tag or branch, url: release or run url }
# The languages and the download script are ThunderAI's, read at that ref: every directory of
# _locales/ (en excluded), downloaded by .github/scripts/weblate_update_status.mjs (a failed
# download fails the run: no PR with partial results). The changes go to the branch
# thunderai-weblate-badges and a PR to master is opened, or the open one updated. No changes, no PR.
# A PR opened with the workflow token does not start other workflows.
on:
  repository_dispatch:
    types: [thunderai-weblate-badges]
  workflow_dispatch:
    inputs:
      ref:
        description: ThunderAI tag or branch to read the languages (_locales/) from
        type: string
        required: true
        default: main
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: thunderai-weblate-badges
  cancel-in-progress: false
env:
  BADGES_DIR: static/weblate/thunderai
  BADGES_BRANCH: thunderai-weblate-badges
  BASE_BRANCH: master
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          path: site

      - name: Checkout ThunderAI
        uses: actions/checkout@v7
        with:
          repository: micz/ThunderAI
          ref: ${{ github.event.client_payload.ref || inputs.ref }}
          path: thunderai
          sparse-checkout: |
            .github/scripts
            _locales

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the badges
        run: >-
          node thunderai/.github/scripts/weblate_update_status.mjs
          "https://hosted.weblate.org/widget/thunderai/-/"
          thunderai/_locales
          "site/$BADGES_DIR/"

      - name: Create or update the PR
        uses: peter-evans/create-pull-request@v8
        with:
          path: site
          token: ${{ github.token }}
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.BADGES_BRANCH }}
          delete-branch: true
          add-paths: ${{ env.BADGES_DIR }}
          commit-message: 'ThunderAI: update Weblate translation badges (${{ github.event.client_payload.ref || inputs.ref }})'
          title: 'ThunderAI: update Weblate translation badges (${{ github.event.client_payload.ref || inputs.ref }})'
          body: |
            Automatic update of the ThunderAI Weblate translation status badges, with the languages of `_locales/` of micz/ThunderAI at `${{ github.event.client_payload.ref || inputs.ref }}`.

            Triggered by: ${{ github.event.client_payload.url || format('manual run {0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
