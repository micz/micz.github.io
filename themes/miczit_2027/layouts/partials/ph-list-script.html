<script>
/* Shared by the placeholders_list and policy_keys_list shortcodes.
   Root: .ph[data-noun] (plural noun for the counter, e.g. "placeholders").
   Rows: .ph-row[data-name] (sort name for A–Z, leading symbols ignored). Adds search, the
   "Group by" switch, anchor following and click-to-copy on .ph-chip. */
(function () {
    Array.prototype.forEach.call(document.querySelectorAll('.ph'), function (root) {
        if (root._phInit) { return; }
        root._phInit = true;

        var noun = root.getAttribute('data-noun') || 'items';
        var azPrefix = root.getAttribute('data-az-prefix') || 'letter-';
        var bar = root.querySelector('.ph-bar');
        var groupsEl = root.querySelector('.ph-groups');
        var search = root.querySelector('.ph-search');
        var countEl = root.querySelector('.ph-count');
        var emptyEl = root.querySelector('.ph-empty');
        var toast = root.querySelector('.ph-toast');
        var switchBtns = root.querySelectorAll('.ph-switch-btn');

        var catSections = Array.prototype.slice.call(groupsEl.children);
        var rows = Array.prototype.slice.call(root.querySelectorAll('.ph-row'));
        var total = rows.length;
        var azSections = null;
        var view = 'category';

        rows.forEach(function (row) {
            row._home = row.parentNode;
            row._name = row.getAttribute('data-name').replace(/^[^a-z0-9]+/i, '');
            row._text = Array.prototype.map.call(
                row.querySelectorAll('.ph-chip, .ph-values, .ph-desc'),
                function (el) { return el.textContent; }
            ).join(' ').toLowerCase();
        });

        bar.hidden = false;

        /* ---- Group by ---- */

        function buildAz() {
            var sorted = rows.slice().sort(function (a, b) {
                return a._name.localeCompare(b._name);
            });
            var sections = [];
            var current = null;
            sorted.forEach(function (row) {
                var letter = row._name.charAt(0).toUpperCase();
                if (!current || current.letter !== letter) {
                    var sec = document.createElement('section');
                    sec.className = 'ph-group';
                    sec.id = azPrefix + letter.toLowerCase();
                    sec.setAttribute('aria-labelledby', sec.id + '-h');
                    var h = document.createElement('h3');
                    h.className = 'ph-group-h';
                    h.id = sec.id + '-h';
                    h.appendChild(document.createTextNode(letter + ' '));
                    var n = document.createElement('span');
                    n.className = 'ph-n';
                    h.appendChild(n);
                    sec.appendChild(h);
                    var cols = catSections[0] && catSections[0].querySelector('.ph-cols');
                    if (cols) { sec.appendChild(cols.cloneNode(true)); }
                    var ul = document.createElement('ul');
                    ul.className = 'ph-card';
                    sec.appendChild(ul);
                    current = { letter: letter, list: ul, rows: [], section: sec };
                    sections.push(current);
                }
                current.rows.push(row);
            });
            return sections;
        }

        function setView(next) {
            if (next === view) { return; }
            view = next;
            if (view === 'az') {
                azSections = azSections || buildAz();
                azSections.forEach(function (g) {
                    g.rows.forEach(function (row) { g.list.appendChild(row); });
                });
                groupsEl.replaceChildren.apply(groupsEl, azSections.map(function (g) { return g.section; }));
            } else {
                rows.forEach(function (row) { row._home.appendChild(row); });
                groupsEl.replaceChildren.apply(groupsEl, catSections);
            }
            root.setAttribute('data-view', view);
            switchBtns.forEach(function (btn) {
                btn.setAttribute('aria-pressed', btn.getAttribute('data-view') === view ? 'true' : 'false');
            });
            applyFilter();
        }

        switchBtns.forEach(function (btn) {
            btn.addEventListener('click', function () { setView(btn.getAttribute('data-view')); });
        });

        /* ---- Search ---- */

        function applyFilter() {
            var q = search.value.trim().toLowerCase();
            var matches = 0;
            rows.forEach(function (row) {
                var hit = !q || row._text.indexOf(q) !== -1;
                row.hidden = !hit;
                if (hit) { matches++; }
            });
            Array.prototype.forEach.call(groupsEl.children, function (sec) {
                var visible = sec.querySelectorAll('.ph-row:not([hidden])').length;
                sec.querySelector('.ph-n').textContent = visible;
                sec.hidden = visible === 0;
            });
            emptyEl.hidden = matches !== 0;
            if (!q) {
                countEl.textContent = total + ' ' + noun;
            } else if (matches === 0) {
                countEl.textContent = 'No ' + noun + ' match';
            } else {
                countEl.textContent = matches + ' of ' + total + (matches === 1 ? ' matches' : ' match');
            }
        }

        search.addEventListener('input', applyFilter);
        search.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && search.value) {
                e.preventDefault();
                search.value = '';
                applyFilter();
            }
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) { return; }
            var t = e.target;
            if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) { return; }
            e.preventDefault();
            search.focus();
        });

        /* ---- Anchors ---- */

        function followHash() {
            var id = decodeURIComponent(location.hash.slice(1));
            if (!id) { return; }
            var isCategory = catSections.some(function (s) { return s.id === id; });
            if (isCategory && view !== 'category') { setView('category'); }
            var target = document.getElementById(id);
            if (!target || !root.contains(target)) { return; }
            if (target.hidden || (target.closest('.ph-group') || {}).hidden) {
                search.value = '';
                applyFilter();
            }
            target.scrollIntoView();
        }
        window.addEventListener('hashchange', followHash);

        /* ---- Copy ---- */

        var toastTimer = null;
        function showToast(text) {
            toast.textContent = text;
            toast.classList.add('is-visible');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('is-visible');
            }, 1400);
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.setAttribute('readonly', '');
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            var ok = false;
            try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
            document.body.removeChild(ta);
            return ok;
        }

        root.addEventListener('click', function (e) {
            var chip = e.target.closest('.ph-chip');
            if (!chip) { return; }
            var text = chip.getAttribute('data-copy');
            var done = function () { showToast('Copied ' + text); };
            var fail = function () {
                if (fallbackCopy(text)) { done(); } else { showToast('Copy failed: select the text and copy it'); }
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(done, fail);
            } else {
                fail();
            }
        });

        applyFilter();
        followHash();
    });
})();
</script>
