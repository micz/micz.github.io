# Production build:
#   hugo --gc --minify
#
# - theme:     miczit_2027 (dark-first editorial theme)
# - publishDir: docs/ (committed, deployed by .github/workflows/static.yml)

baseURL = "https://micz.it/"
languageCode = "en"
title = "Mic's"

publishDir = "docs"
theme = "miczit_2027"

enableRobotsTXT = true

disableKinds = ["RSS","taxonomy","sitemap"]
ignoreErrors = ["error-disable-taxonomy"]
ignoreFiles = ["\\.json$"]

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    [languages.en.params]
      flag = "🇬🇧"
  [languages.it]
    languageName = "Italiano"
    weight = 2
    [languages.it.params]
      flag = "🇮🇹"
  [languages.de]
    languageName = "Deutsch"
    weight = 3
    [languages.de.params]
      flag = "🇩🇪"
  [languages.fr]
    languageName = "Français"
    weight = 4
    [languages.fr.params]
      flag = "🇫🇷"
  [languages.es]
    languageName = "Español"
    weight = 5
    [languages.es.params]
      flag = "🇪🇸"

[params]
   forceCSSReloadID = "20261005"
   Subtitle = "Silence is golden."
   env= "production"
   goatcounterURL = "https://micz.goatcounter.com/count"

# Code highlighting: Chroma emits CSS classes, colored by the .chroma rules in theme.css
# (dark and light tokens) instead of a fixed inline style.
[markup.highlight]
  noClasses = false
